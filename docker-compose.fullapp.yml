

services:
  opencode:
    build:
      context: ./docker/opencode
    image: opencode-mvp
    container_name: mercato-opencode-${DEPLOY_ENV:-local}
    restart: unless-stopped
    environment:
      # Unified AI provider/model selection. OM_AI_* wins; OPENCODE_* stays
      # as a BC fallback resolved by the opencode entrypoint script.
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      # Sprint 0: point AI calls at the local llama.cpp server (OpenAI-compatible).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # In-network MCP wiring. MCP_SERVER_API_KEY (env) wins when set; the
      # file fallback reads the key the mcp service provisioned into the
      # shared volume after waiting for the MCP /health endpoint.
      OPENCODE_MCP_URL: ${OPENCODE_MCP_URL:-http://mcp:3001/mcp}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
    volumes:
      - mcp_shared:/run/mcp-shared:ro
    depends_on:
      mcp:
        condition: service_started
    # Visibility only (compose ps / smoke tests): the entrypoint owns the
    # wait-for-MCP-and-key sequencing.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:4096/global/health"]
      interval: 30s
      timeout: 6s
      retries: 20
      start_period: 900s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mercato-network-fullapp

  mcp:
    image: open-mercato/app:${DEPLOY_ENV:-local}
    container_name: mercato-mcp-${DEPLOY_ENV:-local}
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/mcp-entrypoint.sh ]; then
          echo "ERROR: mcp-entrypoint.sh not found. Please rebuild the container: docker compose build --no-cache app"
          exit 1
        fi
        sh /app/docker/scripts/mcp-entrypoint.sh
    volumes:
      - mcp_shared:/run/mcp-shared
    environment:
      NODE_ENV: development
      NODE_OPTIONS: ${MCP_NODE_OPTIONS:---max-old-space-size=2048}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mercato-postgres-${DEPLOY_ENV:-local}:5432/${POSTGRES_DB:-open-mercato}
      CACHE_REDIS_URL: redis://mercato-redis-${DEPLOY_ENV:-local}:6379
      CACHE_STRATEGY: redis
      AUTO_SPAWN_WORKERS: "false"
      AUTO_SPAWN_SCHEDULER: "false"
      MEILISEARCH_HOST: http://mercato-meilisearch-${DEPLOY_ENV:-local}:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      JWT_SECRET: ${JWT_SECRET:-JWT}
      # Code Mode api.request() must call back into the app over service DNS.
      # NEXT_PUBLIC_* are pinned so a stray .env cannot hijack the base URL.
      APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ""
      # Session-token (tier 2) decryption requires the app's encryption config.
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MCP_PORT: "3001"
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
      MCP_WAIT_FOR_APP_TIMEOUT: ${MCP_WAIT_FOR_APP_TIMEOUT:-1800}
      MCP_DEBUG: ${MCP_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      app:
        condition: service_started
    # Visibility only (compose ps / smoke tests): startup ordering is owned by
    # the entrypoint wait loops, not by this healthcheck.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 900s
    networks:
      - mercato-network-fullapp

  # Traefik (TLS termination, on-demand ACME, custom-domain ForwardAuth gate)
  # is now an opt-in overlay so this base file works behind an external reverse
  # proxy (Dokploy, Caddy, nginx, Cloudflare Tunnel, etc.) without conflict.
  # To run the bundled Traefik, add `-f docker-compose.fullapp.traefik.yml`.

  app:
    build:
      context: .
      args:
        - CONTAINER_PORT=${CONTAINER_PORT:-3000}
    image: open-mercato/app:${DEPLOY_ENV:-local}
    # Without a restart policy the app stays down after a daemon/host reboot
    # while mcp and opencode (restart: unless-stopped) wait on it forever.
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/init-or-migrate.sh ]; then
          echo "ERROR: init-or-migrate.sh not found. Please rebuild the container: docker compose build --no-cache app"
          exit 1
        fi
        if ! INIT_COMMAND='yarn mercato init' sh /app/docker/scripts/init-or-migrate.sh; then
          echo "ERROR: database initialization/migration failed - refusing to start the app."
          echo "       Starting anyway would serve a half-initialized database that looks healthy."
          echo "       The init marker is only written on success, so restarting after a fix re-runs init."
          exit 1
        fi
        yarn start
    volumes:
      - init_marker:/tmp/init-marker
      - attachments_storage:/app/apps/mercato/storage
      - mcp_shared:/run/mcp-shared:ro
    working_dir: /app/apps/mercato
    ports:
      # Bind to loopback by default — Sprint 0's "done when" says the dashboard must
      # be reachable on localhost ONLY, nothing on the LAN. Publishing on 0.0.0.0
      # (the compose default) puts the platform, with DEMO_MODE and self-service
      # onboarding on, in front of the whole local network. In-network traffic is
      # unaffected: the other services reach this one over the docker network, not
      # through the published port. For a cloud deploy set APP_BIND=0.0.0.0 (or drop
      # the bind) in that environment's .env — same file, one value different.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:${CONTAINER_PORT:-3000}"
    # Traefik labels are declared in docker-compose.fullapp.traefik.yml so
    # external reverse proxies (Dokploy, etc.) that also watch the Docker
    # socket don't accidentally pick them up.
    environment:
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      NODE_ENV: development
      # Prevents V8 from growing toward total host RAM before GC kicks in.
      # Override in .env to tune for your host: --max-old-space-size=6144 suits 16 GB+ servers.
      # NOTE: deliberately reads APP_NODE_OPTIONS, NOT NODE_OPTIONS. A developer
      # machine (or tooling) that exports NODE_OPTIONS on the host would otherwise
      # be interpolated straight into the container, where the path does not exist
      # and node aborts at startup. Same reason `mcp` reads MCP_NODE_OPTIONS.
      NODE_OPTIONS: ${APP_NODE_OPTIONS:---max-old-space-size=3072}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      PORT: ${CONTAINER_PORT:-3000}
      # Bind on all interfaces so Docker's published-port forwarding can reach
      # the server; next start otherwise honors the container's HOSTNAME and
      # binds an address unreachable from the host.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mercato-postgres-${DEPLOY_ENV:-local}:5432/${POSTGRES_DB:-open-mercato}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_ACQUIRE_TIMEOUT: ${DB_POOL_ACQUIRE_TIMEOUT:-6000}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-3000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-120000}
      JWT_SECRET: ${JWT_SECRET:-JWT}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      CONSENT_INTEGRITY_SECRET: ${CONSENT_INTEGRITY_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Additional trusted app/dev origins for the Open Mercato origin allowlist (resolveAllowedDevOrigins)
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      REDIS_URL: ${REDIS_URL:-}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-}
      QUEUE_STRATEGY: ${QUEUE_STRATEGY:-local}
      NEXT_PUBLIC_QUEUE_STRATEGY: ${NEXT_PUBLIC_QUEUE_STRATEGY:-local}
      CACHE_REDIS_URL: redis://mercato-redis-${DEPLOY_ENV:-local}:6379
      CACHE_STRATEGY: redis
      RATE_LIMIT_STRATEGY: ${RATE_LIMIT_STRATEGY:-memory}
      OM_MULTI_INSTANCE: ${OM_MULTI_INSTANCE:-false}
      OM_INSTANCE_COUNT: ${OM_INSTANCE_COUNT:-1}
      ENABLE_CRUD_API_CACHE: ${ENABLE_CRUD_API_CACHE:-true}
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      # Sprint 0: point AI calls at the local llama.cpp server (OpenAI-compatible).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      # Point OpenCode clients at the sibling opencode service (the code default
      # http://localhost:4096 is unreachable from inside the app container).
      OPENCODE_URL: ${OPENCODE_URL:-http://opencode:4096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      MEILISEARCH_HOST: http://mercato-meilisearch-${DEPLOY_ENV:-local}:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED: ${NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED:-true}
      UPGRADE_ACTIONS_ENABLED: ${UPGRADE_ACTIONS_ENABLED:-true}
      SELF_SERVICE_ONBOARDING_ENABLED: ${SELF_SERVICE_ONBOARDING_ENABLED:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING: ${OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING:-false}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OM_INIT_SUPERADMIN_PASSWORD: ${OM_INIT_SUPERADMIN_PASSWORD:-password}
      SSO_FORCE_ROLE_ON_LOGIN: employee
      # Custom-domain routing (Phase 1–3 of portal-custom-domain spec).
      DOMAIN_CHECK_SECRET: ${DOMAIN_CHECK_SECRET:-}
      DOMAIN_RESOLVE_SECRET: ${DOMAIN_RESOLVE_SECRET:-}
      INTERNAL_APP_ORIGIN: ${INTERNAL_APP_ORIGIN:-http://app:${CONTAINER_PORT:-3000}}
      PLATFORM_DOMAINS: ${PLATFORM_DOMAINS:-localhost,${PLATFORM_PRIMARY_HOST:-openmercato.com}}
      PLATFORM_PORTAL_BASE_URL: ${PLATFORM_PORTAL_BASE_URL:-https://${PLATFORM_PRIMARY_HOST:-openmercato.com}}
      CUSTOMER_DOMAIN_ORIGIN_HEADER: ${CUSTOMER_DOMAIN_ORIGIN_HEADER:-X-Open-Mercato-Origin}
      # MCP wiring (OPENCODE_URL is declared above with the AI provider block;
      # NEXT_PUBLIC_APP_URL stays a browser-resolvable URL, never service DNS).
      MCP_URL: ${MCP_URL:-http://mcp:3001}
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - mercato-network-fullapp

  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: mercato-postgres-${DEPLOY_ENV:-local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    # ports not exposed - only accessible within docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  redis:
    image: redis:7-alpine
    container_name: mercato-redis-${DEPLOY_ENV:-local}
    # redis is load-bearing: mcp, app and opencode all declare
    # `depends_on: redis: condition: service_healthy`, so if redis is not
    # restarted after a host/Docker restart the whole stack comes up degraded
    # (measured 2026-10-06: redis exited 255, mcp went unhealthy). Every other
    # service in this file carries `restart: unless-stopped`; redis is the only
    # one that did not, which is why it alone stayed down.
    restart: unless-stopped
    # ports not exposed - only accessible within docker network
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mercato-meilisearch-${DEPLOY_ENV:-local}
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    # ports not exposed - only accessible within docker network
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  # ---------------------------------------------------------------------------
  # Local model server — Sprint 0 ("the running trio"). See workspace/COOKBOOK.md,
  # Sprint 0 step 3.2. llama.cpp's OpenAI-compatible server; CPU image (simplest
  # thing that proves the pipes connect). The GGUF is mounted read-only from
  # ./models (gitignored) and named by MODEL_FILE. Reachable in-network at
  # http://model:8080/v1 — that is what OPENAI_BASE_URL points at.
  #
  # -c 65536 is REQUIRED, not a tuning choice. Hermes refuses any model whose
  # served context window is below 64,000 tokens ("needs at least 64K tokens for
  # reliable tool use"); Qwen2.5's GGUF advertises a 32,768 window, so the server
  # must be started with a larger one. Do not lower this without reading
  # agent/agent_init.py::_enforce_minimum_context in the Hermes image.
  # -n caps tokens generated per request (Sprint 0 smoke-test setting).
  # ---------------------------------------------------------------------------
  model:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: mercato-model-${DEPLOY_ENV:-local}
    restart: unless-stopped
    ports:
      # Loopback by default — same reason as the app service above. The model is
      # reached in-network at http://model:8080/v1 (that is what OPENAI_BASE_URL
      # and Hermes use), so nothing needs the host port except manual testing.
      - "${MODEL_BIND:-127.0.0.1}:${MODEL_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/${MODEL_FILE:-Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      - --port
      - "8080"
      - --host
      - 0.0.0.0
      - -c
      - "65536"
      # Qwen2.5's GGUF declares n_ctx_train = 32768, and llama.cpp CAPS the slot
      # context at that value — "-c 65536" alone silently yields n_ctx_slot=32768
      # ("the slot context (65536) exceeds the training context of the model
      # (32768) - capping"). YaRN RoPE scaling is what actually admits 64K.
      - --rope-scaling
      - yarn
      - --rope-scale
      - "2"
      - --yarn-orig-ctx
      - "32768"
      - -n
      - "512"
      # Threads. llama.cpp defaults -t to the number of PHYSICAL cores (4 here)
      # and -tb to -t; the container is given all 8 logical CPUs. Measured on
      # this laptop (Qwen2.5-7B Q4_K_M, 64K ctx, direct /completion call):
      #   default (4/4): ingest 13.2 tok/s, gen 3.9 tok/s
      #   8/8          : ingest 17.7 tok/s, gen 3.0 tok/s  (extra gen threads hurt)
      #   4/8          : ingest 19.3 tok/s, gen 4.6 tok/s  <- this config
      # Prompt ingest is compute-bound and wants all 8; generation is
      # memory-bandwidth-bound, where extra threads cost more than they save.
      - -t
      - "4"
      - -tb
      - "8"
    networks:
      - mercato-network-fullapp

  # ---------------------------------------------------------------------------
  # Hermes agent — Sprint 0 ("the running trio"). See workspace/COOKBOOK.md,
  # Sprint 0 step 3.4. Uses the PREBUILT image (nousresearch/hermes-agent), so
  # there is nothing to build here. Bridge networking + an explicit published
  # port — this is the fix for blocker B-01 (the upstream compose uses
  # network_mode: host, which Docker Desktop for Windows does not do properly).
  #
  # State lives on a NAMED VOLUME, deliberately not a host bind mount.
  # Hermes keeps its state in SQLite in WAL mode. A host bind mount on Docker
  # Desktop for Windows is a cross-VM filesystem (virtiofs/9p), where SQLite's
  # WAL shared-memory is not coherent across the VM boundary — Hermes refuses
  # WAL there and warns that concurrent writers can SILENTLY CORRUPT the
  # database. A named volume is a native filesystem, so WAL is safe. Hermes'
  # own remedy text names this exact fix ("move the database onto a native
  # volume"). It also keeps Sprint 0 from writing into a personal Hermes home.
  #
  # To point this at a host directory instead, replace the volume below with
  # `${HERMES_HOME}:/opt/data` — but read the warning above first, and set
  # `database.journal_mode: delete` in that home's config.yaml.
  #
  # Model + MCP wiring is applied with Hermes' own CLI (never by hand-editing
  # config.yaml — Hermes owns that file and rewrites it). See COOKBOOK.md
  # Sprint 0 step 3.5.
  # ---------------------------------------------------------------------------
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-${DEPLOY_ENV:-local}
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      # Loopback by default — same reason as the app service above.
      - "${HERMES_BIND:-127.0.0.1}:${HERMES_PORT:-8642}:8642"
    volumes:
      - hermes_data:/opt/data
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
    networks:
      - mercato-network-fullapp

  localstack:
    image: localstack/localstack:latest
    container_name: mercato-localstack-${DEPLOY_ENV:-local}
    restart: unless-stopped
    profiles:
      - storage-s3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mercato-network-fullapp

volumes:
  postgres_data:
    name: mercato-postgres-data-${DEPLOY_ENV:-local}
  redis_data:
    name: mercato-redis-data-${DEPLOY_ENV:-local}
  meilisearch_data:
    name: mercato-meilisearch-data-${DEPLOY_ENV:-local}
  localstack_data:
    name: mercato-localstack-data-${DEPLOY_ENV:-local}
  init_marker:
    name: mercato-init-marker-${DEPLOY_ENV:-local}
  attachments_storage:
    name: mercato-attachments-storage-${DEPLOY_ENV:-local}
  mcp_shared:
    name: mercato-mcp-shared-${DEPLOY_ENV:-local}
  # Hermes agent state. Native filesystem so SQLite WAL is safe (see the hermes
  # service comment above).
  hermes_data:
    name: mercato-hermes-data-${DEPLOY_ENV:-local}

networks:
  mercato-network-fullapp:
    name: mercato-network-${DEPLOY_ENV:-local}
    driver: bridge
