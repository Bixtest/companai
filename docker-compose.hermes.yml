# The Hermes TUI-gateway worker — a SEPARATE, opt-in compose file.
#
# WHY IT IS SEPARATE (the owner's ruling, 2026-10-12)
# --------------------------------------------------
# The choice was put to the owner as one question with a recommendation: add
# Hermes to the shared `docker-compose*.yml` files (so it starts with the stack
# for everyone), or keep it in its own file so it stays opt-in until Phase 2
# proves it. **Ruled: separate file.** The reasoning is the one that keeps
# OpenCode load-bearing — an engine that is not yet proven behind the door
# should not start by default for every developer, and `P2-1` proves only that
# the pinned worker boots and speaks the handshake. It is not behind the port
# (`P2-3`), it does not serve the chat (`P2-5`).
#
#   docker compose -f docker-compose.hermes.yml up --build --detach
#   docker compose -f docker-compose.hermes.yml logs --follow
#   docker compose -f docker-compose.hermes.yml down
#
# WHAT IT RUNS
# ------------
# `python -m tui_gateway.entry` from the pinned source, speaking
# newline-delimited JSON-RPC on stdio (measured: `tui_gateway/entry.py`'s
# `main()`, `tui_gateway/transport.py`'s framing). There is no port to expose:
# the platform spawns the worker and owns its pipes (that is `P2-3`'s adapter).
# The gateway's own frames land in the container log, so the boot — including
# the `gateway.ready` event — is inspectable from outside.
#
# IT IS NOT THE `hermes-local` SERVICE. The platform's own
# `docker-compose.fullapp.yml` already runs `nousresearch/hermes-agent:latest`
# with `command: ["gateway","run"]` and a published port (8642) — the upstream
# **HTTP** gateway, built by someone else's release process. This file runs the
# **pinned source** over **stdio**, the door the platform's own client
# (`hermes-gateway-client.ts`, `P2-2`) speaks. Two different doors into Hermes;
# this one exists because the chat integration goes through the typed port
# (`P2-3`), and the image tag `:latest` cannot be digest-verified at boot while
# the mounted pin can.
#
# WHAT IT NEEDS FROM THE HOST
# ---------------------------
#   HERMES_PIN_DIR   the pinned source tree. Defaults to `../../hermes-agent-main`,
#                    which is correct for this repository layout (the code repo
#                    lives at `workspace/starting-kit` inside the docs repo that
#                    holds the pin). Override it if your pin lives elsewhere.
#                    The tree is mounted READ-ONLY and digest-verified at boot,
#                    so nothing may be written into it.
#   HERMES_PIN_DIGEST  the digest the mounted tree must produce. Defaults to the
#                    recorded pin (`07ee857b…`, revision `db44c462…`).
#
# Provider keys are read from the host environment exactly as the OpenCode
# service reads them. The handshake needs neither a key nor a model — no model
# is called before `gateway.ready` — so this file boots clean without them.
#
# The platform's MCP tools (`P2-9a`) need one more thing from the host: the
# credential the `mcp` service provisioned. It comes from `MCP_SERVER_API_KEY`
# or, when that is unset, from the shared `mcp_shared` volume this file mounts
# read-only — the same ordering OpenCode uses.
#
# TWO PRECONDITIONS, and they fail DIFFERENTLY. Measured while hardening this
# file (a hostile critic raised it), so neither is mistaken for the other:
#   · The VOLUME must EXIST. It is declared `external` — like the network, and
#     for the same reason: this file must never create or destroy something
#     another stack owns. So on a host where `docker-compose.fullapp.yml` has
#     never run, this service cannot start AT ALL: compose fails at volume
#     resolution, *before* the entrypoint's fail-soft path can run. Create the
#     volume (or bring fullapp up once) first. The `up` lines above therefore
#     describe a host that already runs the platform — which is what this file
#     is for.
#   · The CREDENTIAL may be ABSENT, and that is NOT an error. The worker still
#     boots and still serves chat; it simply has no platform tools, and both the
#     entrypoint and the bootstrap say so on stderr.

services:
  hermes-gateway:
    build:
      context: ./docker/hermes
      # A NAMED build context: only the two manifests the Dockerfile COPYs are
      # transferred, so the build costs kilobytes instead of the pin's 87 MB,
      # and no second copy of the pin is created (L136).
      additional_contexts:
        hermes_pin: ${HERMES_PIN_DIR:-../../hermes-agent-main}
    image: hermes-gateway:p2-9a
    container_name: mercato-hermes-gateway
    restart: unless-stopped
    environment:
      # State root. Writable volume; the mounted source stays read-only.
      HERMES_HOME: /var/lib/hermes
      # The pin this worker is allowed to run.
      HERMES_PIN_DIGEST: ${HERMES_PIN_DIGEST:-07ee857bdab59a875317035d8aaad4d6}
      HERMES_SKIP_PIN_VERIFY: ${HERMES_SKIP_PIN_VERIFY:-}
      # Provider selection, recorded on the run (P2-3 turns it into a gateway
      # call). Same contract the platform already speaks for OpenCode.
      # NOTE (P2-7, §2.13 — measured): the Hermes WORKER does not read these. Its
      # provider registry (`hermes_cli/auth.py` + `providers.py`) is keyed on
      # `HERMES_*` and the per-provider key/base-URL vars, so `OM_AI_PROVIDER`/
      # `OM_AI_MODEL` are inert here — kept only for the shared `.env` contract.
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-}
      # ── THE WORKER'S OWN MODEL CONFIG (P2-7, §2.13) ────────────────────────
      # The worker resolves its provider from `config.yaml model.provider`, else
      # AUTO-DETECTS it from whichever API key is present (`resolve_provider()`,
      # `hermes_cli/auth.py:1629`): with OPENAI_API_KEY set it selects
      # `openai-api`, whose transport is `codex_responses` and whose base URL is
      # `OPENAI_BASE_URL` (`auth.py:177`, `providers.py:34-35`). The platform's
      # `.env` already sets `OPENAI_BASE_URL=http://model:8080/v1`, but this file
      # did NOT forward it — so the worker called api.openai.com. Forward it, and
      # name the model the worker asks for: its model comes from `HERMES_MODEL`
      # (`tui_gateway/server.py:1544-1561`), not `OM_AI_MODEL`.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      HERMES_MODEL: ${HERMES_MODEL:-${OM_AI_MODEL:-}}
      # ── THE PREFILL GRACE (P2-7, §2.13 — measured) ─────────────────────────
      # The worker aborts a turn whose provider has produced no event within its
      # local-provider stale ceiling: `agent.local_stream_stale_timeout`, default
      # **900s** (`agent/chat_completion_helpers.py:634-648`), overridable by this
      # var. That ceiling must EXCEED the model's prefill time, and on the
      # platform's own Sprint-0 stack it does not. Three real turns driven
      # through the pinned worker on this 4-CPU box (Docker Desktop exposes 4 of
      # the host's 8), each read from the model's own `prompt eval time` line —
      # NOT the `progress =` fraction, which mis-states the total by up to 2.5x
      # (LESSONS L153):
      #   · 6105 tokens (toolset pinned to `search`)  → 608s  @ 10.1 tok/s
      #   · 10,988 tokens (the DEFAULT toolsets)      → 1583s @ 6.94 tok/s
      #   · 10,646 tokens (the DEFAULT toolsets, the PRODUCTION-SHAPED run,
      #     test suite alongside)                     → ~1905s @ ~5.6 tok/s
      # The third is the number the value below must beat: the 900s default
      # aborts EVERY real turn on this stack, 1800s leaves only 217s over the
      # second measurement, so the grace is **2400s** — 495s over the slowest
      # prefill actually measured. The cost: a hung local provider takes 40 min
      # to diagnose instead of 15. This is a HARDWARE grace, not a correctness
      # knob — a deployment with a fast model never reaches it.
      HERMES_LOCAL_STREAM_STALE_TIMEOUT: ${HERMES_LOCAL_STREAM_STALE_TIMEOUT:-2400}
      # Provider credentials, forwarded only when the operator set them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Let the worker reach the platform's MCP server. The default is the
      # IN-NETWORK service name, matching the OpenCode service's own
      # `OPENCODE_MCP_URL` default — measured: `getent hosts mcp` inside this
      # worker resolves to 172.18.0.2 on `mercato-network-local`, and the app
      # container's own default was `host.docker.internal`, which the worker
      # cannot use to reach a sibling on the shared network.
      HERMES_MCP_URL: ${HERMES_MCP_URL:-http://mcp:3001/mcp}
      # ── THE PLATFORM'S MCP TOOLS (P2-9a, §2.15 — measured) ────────────────
      # The pinned worker ships a COMPLETE MCP client, but its SDK was not in
      # this image and it had no `mcp_servers` config — so a Hermes-served chat
      # could call NONE of the 21 platform tools an OpenCode-served chat can.
      # `entrypoint.py` resolves this credential and `mcp_bootstrap.py` writes
      # the worker's `mcp_servers` entry naming the URL above; the entry holds
      # the placeholder `${MCP_SERVER_API_KEY}`, resolved at read time from the
      # worker's own environment, so the secret is never written to the state
      # volume and a rotation needs no volume edit. Same ordering as OpenCode:
      # the env var wins, the shared key file is the fallback.
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
      # Bounded wait for that file when the env var is unset (the `mcp` service
      # provisions it after its own boot, so a cold start races). Only paid when
      # the credential is genuinely absent.
      HERMES_MCP_KEY_WAIT_SECONDS: ${HERMES_MCP_KEY_WAIT_SECONDS:-60}
      # ── THE WEBSOCKET DOOR (P2-8, §2.14 — measured) ───────────────────────
      # The pin's own ws transport (`tui_gateway/ws.py` — identical wire, the
      # same `server.dispatch`), mounted by `ws_host.py` in a thread beside
      # the stdio channel. The app container has neither Python nor the
      # Docker socket, so it cannot spawn this worker: it CONNECTS it, by URL,
      # over the shared Docker network — `ws_entry.py` (the CMD below) is the
      # process that serves it. Three legs, the pin's own ticket auth: the
      # app POSTs a mint request carrying the shared secret, gets a
      # single-use 30s ticket, and upgrades `/api/ws?ticket=…` (4401 on a bad
      # ticket, exactly the pin's convention).
      HERMES_WS_TOKEN: ${HERMES_WS_TOKEN:-}
      HERMES_WS_HOST: ${HERMES_WS_HOST:-0.0.0.0}
      HERMES_WS_PORT: ${HERMES_WS_PORT:-8091}
    volumes:
      # The pinned source, read-only: the code that runs is the pin, and the
      # entrypoint proves it by digest before importing anything.
      - ${HERMES_PIN_DIR:-../../hermes-agent-main}:/hermes-src:ro
      - hermes_state:/var/lib/hermes
      # The MCP credential the `mcp` service provisions (P2-9a). READ-ONLY, and
      # the SAME volume the OpenCode and mcp services share — this file never
      # creates or owns it (see the `volumes:` block at the bottom). The key is
      # read by the entrypoint and carried in the worker's environment; it is
      # never copied into `hermes_state`.
      - mcp_shared:/run/mcp-shared:ro
    # The gateway's stdin is its client channel. Keeping it open means the
    # worker waits for a client instead of seeing EOF and exiting; the client
    # that attaches is `P2-3`'s adapter (or a hand-driven session for the gate).
    # The process that owns it is `ws_entry.py` (the image CMD, P2-8): the
    # stdio entry runs in the MAIN thread as always, with the ws door in a
    # daemon thread beside it — one `tui_gateway.server`, two transports, the
    # desktop product's in-process shape.
    stdin_open: true
    tty: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mercato-network

  # ── THE PROMPT-CACHE WARM-UP (added 2026-10-16) ───────────────────────────
  # WHY THIS SERVICE EXISTS
  # -----------------------
  # The first turn of a conversation on this stack costs ~2,264 s (~38 min) —
  # measured, 16,572 tokens at 7.32 tok/s on the 4 CPUs this VM used to expose.
  # Nothing is asleep: the model container has `restart: unless-stopped` and had
  # been up 15 hours when that was measured. The cost is that the model must
  # READ the whole shared instruction sheet before it can answer.
  #
  # It does not have to read it again for the NEXT conversation. The model
  # server caches prompt prefixes in process RAM (`--cache-prompt` default on,
  # `--cache-ram` default 8192 MiB), and the reuse is measured twice over:
  #   · two real sessions recorded `cache_read_tokens = 16,724`;
  #   · a live probe saw a cold call at 112.2 s, then warm calls at 1.2 s and
  #     0.9 s with `cache_n` 1142 of 1148 — a DIFFERENT conversation reusing
  #     the shared prefix, ~93x faster.
  #
  # The gap is therefore narrow and specific: the FIRST turn after the model
  # process starts. Four model loads were measured in two days (`RestartCount=0`,
  # `OOMKilled=false` — the restarts came from outside the container), and each
  # one emptied the RAM cache. The next human to open a chat paid all 38 minutes.
  #
  # WHAT IT DOES
  # ------------
  # `warmup.py` replays the shared prefix to the model server so the cache is
  # already full before anyone asks a question. It does NOT rebuild the prompt:
  # the worker already stores both halves of the exact request prefix in its own
  # state DB (`sessions.system_prompt_hash` -> the system text, 26,549 chars;
  # `sessions.tool_names` -> the tools array in literal OpenAI wire JSON,
  # 42,619 chars; 26,549 + 42,619 = the 69,168 chars the prompt audit measured).
  # The script reads those two rows and posts them back unchanged — same bytes
  # in, same tokens rendered, same prefix cached, nothing to keep in sync.
  #
  # VERIFIED 2026-10-16: the replay matched the model's cached prefix at
  # **16,558 of 16,560 tokens** and returned in 8.1 s. Byte-faithful, and
  # effectively free when the cache is already warm.
  #
  # WHY IT LOOPS RATHER THAN RUNNING ONCE
  # -------------------------------------
  # The case that hurts is the model restarting UNDER a long-lived worker, which
  # a boot-time-only warm-up would miss entirely. Each cycle reads back
  # `usage.prompt_tokens_details.cached_tokens` and reports COLD (it just filled
  # the cache) or already WARM (the cycle was ~free), so the loop is self-healing
  # with no restart detection at all. A SKIPPED cycle — model still starting, or
  # no session has stored a prefix yet — retries in 30 s instead of waiting out
  # the interval, so the warm-up lands the moment the stack is ready.
  #
  # WHY ITS OWN IMAGE AND NOT THE WORKER'S
  # --------------------------------------
  # `warmup.py` is stdlib-only (`urllib`, `sqlite3`, `json`), so it needs no
  # dependency closure — a bare `python:3.14-slim-bookworm`, which is already
  # the worker image's own base and therefore already on the host, is enough.
  # The script arrives as a read-only bind mount, so changing it needs no image
  # rebuild and no restart of the worker. Verified: that image carries
  # `sqlite3` (3.40.1).
  #
  # WHY THE STATE VOLUME IS MOUNTED READ-WRITE
  # ------------------------------------------
  # Not a mistake, and not a licence to write. The script opens the DB itself
  # with `mode=ro` and only ever SELECTs; the mount's mode is about SQLite's
  # requirement, not this service's behaviour. It shares the SAME named volume
  # the worker owns.
  #
  # MEASURED 2026-10-16 (rule 13 — corrected by name): this block used to
  # justify the rw mount with the WAL rule — "SQLite cannot read a WAL database
  # through a read-only mount, because the reader needs write access to the
  # `-shm` wal-index file". The worker's own boot log says otherwise for THIS
  # database: `state.db: … using journal_mode=DELETE instead of enabling WAL`
  # (it refuses WAL because its bundled SQLite 3.40.1 is WAL-reset-vulnerable).
  # So the WAL rationale does not describe the deployed database. The mount
  # stays read-write because it is harmless, the script never writes, and a
  # future WAL flip would need it.
  hermes-warmup:
    image: python:3.14-slim-bookworm
    container_name: mercato-hermes-warmup
    restart: unless-stopped
    command: ["python3", "-u", "/opt/warmup/warmup.py"]
    environment:
      # The same service the worker reaches: `.env` sets
      # `OPENAI_BASE_URL=http://model:8080/v1`. Note that llama.cpp's control
      # endpoints (`/props`) live at the ROOT, not under `/v1` — `warmup.py`
      # derives the root from this value.
      WARMUP_MODEL_BASE_URL: ${WARMUP_MODEL_BASE_URL:-http://model:8080/v1}
      WARMUP_STATE_DB: /var/lib/hermes/state.db
      # Cosmetic only — llama.cpp does not validate the model name — but it
      # keeps the request shaped like the worker's.
      WARMUP_MODEL_NAME: ${HERMES_MODEL:-${OM_AI_MODEL:-}}
      # How often to re-check that the cache is still warm. When it IS warm a
      # cycle costs one token of decode, so the interval can be short without
      # being wasteful; 600 s bounds the cold window after a model restart.
      WARMUP_INTERVAL_SECONDS: ${WARMUP_INTERVAL_SECONDS:-600}
      # MUST exceed a cold prefill, or every cold warm-up aborts and the service
      # silently never does its job. Measured 2,264 s on 4 CPUs; 3600 s is the
      # ceiling with headroom. A fast model never approaches it.
      WARMUP_TIMEOUT_SECONDS: ${WARMUP_TIMEOUT_SECONDS:-3600}
      # Set to 0 to keep the service resident but idle.
      WARMUP_ENABLED: ${WARMUP_ENABLED:-1}
    volumes:
      - ./docker/hermes/warmup.py:/opt/warmup/warmup.py:ro
      - hermes_state:/var/lib/hermes
    networks:
      - mercato-network

volumes:
  hermes_state:
    name: mercato-hermes-state
  # The MCP credential volume, owned by `docker-compose.fullapp.yml` (the `mcp`
  # service writes the key into it; OpenCode reads it). EXTERNAL for the same
  # reason the network is: this file must never create or destroy a volume
  # another stack owns — `down` here cannot take the platform's MCP key with it.
  # The name tracks the fullapp file's own `${DEPLOY_ENV:-local}` suffix, so the
  # two files address the same volume by default.
  mcp_shared:
    name: ${HERMES_MCP_SHARED_VOLUME:-mercato-mcp-shared-${DEPLOY_ENV:-local}}
    external: true

networks:
  # WHICH NETWORK — measured 2026-10-12 (rule 0b), corrected after the fact.
  # The first version of this file copied `docker-compose.yml`, which hardcodes
  # `name: mercato-network` — and the measurement falsified that choice: the
  # container on `mercato-network` was this worker alone, while everything that
  # actually runs (`docker-compose.fullapp.yml`, and `.fullapp.dev.yml`) declares
  # `name: mercato-network-${DEPLOY_ENV:-local}` = `mercato-network-local`, and
  # the whole `*-local` stack — postgres, redis, mcp, meilisearch, model,
  # opencode, app, plus the upstream `hermes-local` HTTP gateway on 8642 — sits
  # on it. Default = the network the operator's stack really uses.
  #
  # EXTERNAL on purpose: this file must never create or destroy a network
  # another stack owns. `docker compose -f docker-compose.hermes.yml down`
  # cannot take the platform's network with it.
  mercato-network:
    name: ${HERMES_DOCKER_NETWORK:-mercato-network-local}
    external: true
